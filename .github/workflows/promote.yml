name: Promote to production

# Promotes this repository's (beta) content over the production site
# (thluiz/metron-hotsite → metron.hybris.world), opening a Pull Request for
# review. Merging the PR is what triggers the production deploy.
#
# Run from the Actions tab → "Promote to production" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note shown in the PR body"
        required: false
        default: ""

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta (source)
        uses: actions/checkout@v4
        with:
          path: beta
          # Full history: needed to list commits since the last promotion
          # (see "Build changelog" below).
          fetch-depth: 0

      - name: Checkout production (destination)
        uses: actions/checkout@v4
        with:
          repository: thluiz/metron-hotsite
          token: ${{ secrets.PROMOTE_TOKEN }}
          path: prod

      - name: Build changelog since the last promotion
        id: changelog
        # The .promoted-from-beta-sha file (only exists in production, never
        # in beta) holds the beta SHA that was promoted last time. Without it
        # (first promotion with this mechanism), lists the last 10 commits
        # instead of trying to guess a starting point.
        run: |
          MARKER="prod/.promoted-from-beta-sha"
          CURRENT_SHA=$(git -C beta rev-parse HEAD)

          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -f "$MARKER" ] && git -C beta cat-file -e "$(cat "$MARKER")" 2>/dev/null; then
              git -C beta log --pretty='- %h %s' "$(cat "$MARKER")"..HEAD
            else
              echo "_No record of a previous promotion — last 10 commits from beta:_"
              git -C beta log --pretty='- %h %s' -n 10
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$CURRENT_SHA" > "$MARKER"

      - name: Overlay beta content onto production
        # Copies everything from beta over production, removing files that no
        # longer exist in beta (--delete). Preserves production's
        # environment-specific files: .git, .github (workflows/project-name),
        # README, and the changelog marker written in the previous step.
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.promoted-from-beta-sha' \
            beta/ prod/

      - name: Open promotion PR on production
        uses: peter-evans/create-pull-request@v6
        with:
          path: prod
          token: ${{ secrets.PROMOTE_TOKEN }}
          branch: promote/from-beta
          base: main
          delete-branch: true
          commit-message: "Promote: beta content into production"
          title: "Promote: beta → production"
          body: |
            Automated promotion of
            [`metron-hotsite-beta`](https://github.com/thluiz/metron-hotsite-beta)
            content over production.

            Triggered via **Actions → Promote to production**.

            ${{ github.event.inputs.note }}

            ### Commits included
            ${{ steps.changelog.outputs.changelog }}

            ---
            Merging this PR triggers the production deploy
            (`metron.hybris.world`).
